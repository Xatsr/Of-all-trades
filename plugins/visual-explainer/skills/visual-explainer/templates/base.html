<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Title</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-2: #f0efeb;
    --text: #1d1d1b;
    --muted: #6b6a66;
    --border: #e2e0da;
    --accent: #2f6fdb;
    --good: #2e8b57;
    --warn: #b7791f;
    --bad: #c53030;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1e1e1c;
      --surface-2: #262624;
      --text: #ecebe6;
      --muted: #a09f99;
      --border: #34332f;
      --accent: #6ea0ff;
      --good: #5cc28a;
      --warn: #e0a84a;
      --bad: #f07373;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--sans);
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  header.page { margin-bottom: 32px; }
  header.page h1 { margin: 0 0 4px; font-size: 1.9rem; line-height: 1.2; }
  header.page p { margin: 0; color: var(--muted); }
  section { margin: 0 0 40px; }
  h2 { font-size: 1.3rem; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.05rem; margin: 0 0 6px; }
  code, pre { font-family: var(--mono); font-size: 0.88em; }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; }
  pre code { background: none; padding: 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .cols-2 { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .cols-2 { grid-template-columns: 1fr; } }

  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat .value { font-size: 1.8rem; font-weight: 600; line-height: 1.1; }
  .stat .label { color: var(--muted); font-size: 0.9rem; }

  .layer { margin-bottom: 20px; }
  .layer > .layer-name { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  .card .where { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.8rem; border: 1px solid currentColor; }
  .badge.good { color: var(--good); }
  .badge.warn { color: var(--warn); }
  .badge.bad { color: var(--bad); }

  .diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; }
  .diagram .mermaid { display: flex; justify-content: center; margin: 0; padding: 0; background: none; }
  .diagram figcaption { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 2px solid var(--border); }
  .timeline li { position: relative; margin: 0 0 18px; }
  .timeline li::before { content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .timeline .when { color: var(--muted); font-size: 0.85rem; }

  .finding { border-left: 3px solid var(--bad); }
  .finding.warn { border-left-color: var(--warn); }
  .sources { font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="page">
    <h1>Page Title</h1>
    <p>One sentence on what this page explains.</p>
  </header>

  <!-- Replace with sections from references/patterns.md -->
  <section>
    <h2>Overview</h2>
    <figure class="diagram">
      <pre class="mermaid">
flowchart LR
  A[Input] --> B[Process] --> C[Output]
      </pre>
      <figcaption>Main path.</figcaption>
    </figure>
  </section>

  <section class="sources">
    <h2>Sources</h2>
    <ul>
      <li><code>path/to/file.ext:12</code></li>
    </ul>
  </section>
</main>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({
    startOnLoad: true,
    theme: dark ? "dark" : "default",
    securityLevel: "strict",
    fontFamily: getComputedStyle(document.body).fontFamily,
  });
</script>
</body>
</html>
