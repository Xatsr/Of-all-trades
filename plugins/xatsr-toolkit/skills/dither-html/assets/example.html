<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dither Demo</title>
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #57534e;
      --dither-ink: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #fafaf9;
        --muted: #a8a29e;
        --dither-ink: #e7e5e4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, sans-serif;
    }
    .hero {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
    }
    /* Content sits above the canvas the script adds as the first child. */
    .hero > :not(canvas) { position: relative; z-index: 1; }
    .hero h1 { font-size: clamp(2rem, 7vw, 4.5rem); margin: 0; }
    .hero p { color: var(--muted); margin: 0.5rem 0 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      height: 200px;
      border: 1px solid color-mix(in oklab, var(--fg) 15%, transparent);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    .card span {
      position: relative;
      z-index: 1;
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- A custom field that borrows nothing: clear ground behind the headline. -->
  <section class="hero" data-dither="#hero-field" data-cell="3">
    <div>
      <h1>Dithered, no build step</h1>
      <p>One script tag, one attribute.</p>
    </div>
  </section>

  <div class="grid">
    <div class="card" data-dither="aurora"><span>aurora</span></div>
    <div class="card" data-dither="plasma"><span>plasma</span></div>
    <div class="card" data-dither="silk"><span>silk</span></div>
    <div class="card" data-dither="retro-grid"><span>retro-grid</span></div>
    <div class="card" data-dither="beams" data-ink="oklch(0.6 0.18 250)"><span>beams, recoloured</span></div>
    <div class="card" data-dither="metaballs" data-uniforms='{"metaballsMode": 1}'><span>metaballs, rings</span></div>
  </div>

  <script type="x-shader/x-field" id="hero-field">
    float field(vec2 uv, vec2 res, float t) {
      vec2 p = vec2(uv.x * res.x / res.y, uv.y);
      float clouds = fbm(p * 2.0 + vec2(t * 0.03, 0.0));
      // Clear ground in the middle, where the headline sits.
      vec2 c = (uv - 0.5) * vec2(res.x / res.y, 1.0);
      float clear = smoothstep(0.15, 0.55, length(c * vec2(0.6, 1.4)));
      return clouds * clear * 0.75;
    }
  </script>
  <script src="dither.js"></script>
</body>
</html>
