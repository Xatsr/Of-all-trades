# PR review by Claude, on request only: the repo owner comments "@claude review" (or "@claude cc") on a pull request.
# Anyone else's comment is ignored. Read-only on the code: it comments, it never pushes.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      (github.event.issue.pull_request || github.event.pull_request) &&
      contains(github.event.comment.body, '@claude') &&
      (contains(github.event.comment.body, 'review') || contains(github.event.comment.body, 'cc'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # The action switches to the PR branch next: keep main's review format, so a PR can't change how it gets reviewed
      - run: cp .github/claude-review.md "$RUNNER_TEMP/claude-review.md"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: |
            --max-turns 8
            --add-dir ${{ runner.temp }}
            --append-system-prompt "Follow ${{ runner.temp }}/claude-review.md exactly (not the copy in the repo): read it first, then review the pull request diff and reply in that format."
